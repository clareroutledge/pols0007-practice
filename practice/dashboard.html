<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>POLS0007 practice: teacher dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body><main id="app"><h1>Teacher dashboard</h1><p id="msg">Loading…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const C=window.PRACTICE_CONFIG;const sb=supabase.createClient(C.url,C.key);const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const MIS={DIFF:'Difference ≠ effect',INTEXT:'Internal vs external mix-up',BOTH:'Thinks both outcomes are seen',LABEL:'Symbol labels (i, 1, 0)',THREAT:'Threat mix-up',DIR:'Direction of bias',WHO:'Researcher vs participant',DEF:'Definition mix-up',CALC:'Arithmetic slip',VAGUE:'Vague short answer'};
async function main(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){app.innerHTML=`<h1>Teacher dashboard</h1><div class="card"><p>Sign in with your email to see class results.</p><input id="em" type="email" placeholder="your email" style="font:inherit;padding:10px;border:3px solid #1B2340;border-radius:12px;width:100%;margin-bottom:10px"><button class="btn" id="go">Send me a sign-in link</button><p id="st"></p></div>`;
  document.getElementById('go').onclick=async()=>{const {error}=await sb.auth.signInWithOtp({email:document.getElementById('em').value,options:{emailRedirectTo:location.href.split('#')[0]}});document.getElementById('st').textContent=error?error.message:'Check your inbox for the link.'};return}
 let rows=[],from=0;
 while(true){const {data,error}=await sb.from('attempts').select('*').order('id').range(from,from+999);if(error){app.innerHTML='<h1>Teacher dashboard</h1><p>'+esc(error.message)+'</p>';return}rows=rows.concat(data);if(data.length<1000)break;from+=1000}
 if(!rows.length){app.innerHTML='<h1>Teacher dashboard</h1><p>No attempts yet.</p>';return}
 const students=new Set(rows.map(r=>r.student));const acc=a=>a.length?Math.round(100*a.filter(r=>r.correct).length/a.length):0;
 const byC={};rows.forEach(r=>(byC[r.concept]=byC[r.concept]||[]).push(r));
 const cons=Object.entries(byC).map(([c,a])=>[c,acc(a),a.length]).sort((a,b)=>a[1]-b[1]);
 const mis={};rows.filter(r=>r.misconception).forEach(r=>mis[r.misconception]=(mis[r.misconception]||0)+1);
 const byS={};rows.forEach(r=>(byS[r.student]=byS[r.student]||[]).push(r));
 const qs={};rows.forEach(r=>{const q=qs[r.question_id]=qs[r.question_id]||[0,0];q[0]++;if(r.correct)q[1]++});
 const hard=Object.entries(qs).filter(([_,v])=>v[0]>=5).map(([k,v])=>[k,Math.round(100*v[1]/v[0]),v[0]]).sort((a,b)=>a[1]-b[1]).slice(0,8);
 app.innerHTML=`<div class="top"><h1>Teacher dashboard</h1><span class="badge">${students.size} students · ${rows.length} answers</span></div>
 <div class="card"><h2>Accuracy by concept (lowest first)</h2>${cons.map(([c,p,n])=>`<div class="row"><span>${esc(c.replace(/-/g,' '))} <small>(${n})</small></span><div class="meter"><i style="width:${p}%"></i></div><b>${p}%</b></div>`).join('')}</div>
 <div class="card tan"><h2>Most common mix-ups</h2>${Object.entries(mis).sort((a,b)=>b[1]-a[1]).map(([m,n])=>`<p><b>${esc(MIS[m]||m)}</b>: ${n} answers from ${new Set(rows.filter(r=>r.misconception===m).map(r=>r.student)).size} students</p>`).join('')||'<p>None yet.</p>'}</div>
 <div class="card"><h2>Hardest questions (5+ attempts)</h2>${hard.map(([q,p,n])=>`<p><b>${esc(q)}</b>: ${p}% correct (${n} attempts)</p>`).join('')||'<p>Not enough data yet.</p>'}</div>
 <div class="card"><h2>Students (anonymous codes)</h2><table><tr><th>Code</th><th>Answers</th><th>Accuracy</th><th>Weakest concept</th></tr>${Object.entries(byS).sort((a,b)=>b[1].length-a[1].length).map(([s,a])=>{const g={};a.forEach(r=>(g[r.concept]=g[r.concept]||[]).push(r));const w=Object.entries(g).filter(([_,x])=>x.length>=2).map(([c,x])=>[c,acc(x)]).sort((p,q)=>p[1]-q[1])[0];return`<tr><td>${esc(s)}</td><td>${a.length}</td><td>${acc(a)}%</td><td>${w?esc(w[0].replace(/-/g,' ')):'–'}</td></tr>`}).join('')}</table></div>
 <p><button class="btn alt" id="so">Sign out</button></p>`;
 document.getElementById('so').onclick=async()=>{await sb.auth.signOut();location.reload()}}
main();
</script></body></html>
