<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Measurement Practice Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#F7F6F1;--card:#FFFFFF;--fg:#1F2A37;--mut:#556070;--line:#D9D6CB;--acc:#2F5D9E;--accbg:#E8EEF7;--warm:#B4470F;--warmbg:#FBE9DD;--ok:#14663A;--okbg:#E1F3E8;--bad:#9B1C1C;--badbg:#FBE4E4;--dot:#3B6FB6;--ghost:#8E95A1;--truth:#6B7280}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181F;--card:#1C222B;--fg:#ECEAE3;--mut:#A4ADBA;--line:#343C48;--acc:#8DB4EA;--accbg:#22324A;--warm:#F0A06E;--warmbg:#3A2A20;--ok:#7FD39F;--okbg:#1E3528;--bad:#F1A0A0;--badbg:#3F2323;--dot:#6FA0E0;--ghost:#7B8492;--truth:#A4ADBA;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181F;--card:#1C222B;--fg:#ECEAE3;--mut:#A4ADBA;--line:#343C48;--acc:#8DB4EA;--accbg:#22324A;--warm:#F0A06E;--warmbg:#3A2A20;--ok:#7FD39F;--okbg:#1E3528;--bad:#F1A0A0;--badbg:#3F2323;--dot:#6FA0E0;--ghost:#7B8492;--truth:#A4ADBA;color-scheme:dark}
*{box-sizing:border-box}:root{color-scheme:light}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 'Public Sans',system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#app{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:14px}
header{display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#part{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
h1{font-size:28px;line-height:1.2;margin:0;text-wrap:balance}
h3{margin:0 0 6px;font-size:19px}
p{margin:0 0 10px}p:last-child{margin-bottom:0}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:var(--card);border:0;border-radius:10px;padding:10px 18px;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.btn.sm{padding:6px 12px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card.key{background:var(--accbg);border-color:var(--acc)}
.card.warm{background:var(--warmbg);border-color:var(--warm)}
.try{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--warm);margin-bottom:4px}
.qt{font-weight:700;font-size:18px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{text-align:left;background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:10px;padding:10px 14px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);opacity:.75}
.done .opt:not(.ok){opacity:.5}
.fb{margin-top:10px;border-radius:10px;padding:10px 14px}.fb.ok{background:var(--okbg);color:var(--fg);border-left:5px solid var(--ok)}.fb.bad{background:var(--badbg);border-left:5px solid var(--bad)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:2px dashed var(--line);border-radius:12px;margin:10px 0}
.chip{background:var(--card);border:2px solid var(--acc);border-radius:10px;padding:7px 12px;cursor:grab;font-size:16px;line-height:1.35;user-select:none;max-width:100%}
.chip.sel{background:var(--accbg);outline:3px solid var(--warm)}
.chip.lock{border-color:var(--ok);background:var(--okbg);cursor:default}
.chip.wrong{border-color:var(--bad);background:var(--badbg)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.bucket{border:2px solid var(--line);border-radius:12px;padding:10px;min-height:96px;background:var(--bg)}
.bucket.over{border-color:var(--warm);background:var(--warmbg)}
.bl{font-weight:700;font-size:16px}.bs{font-size:14px;color:var(--mut);margin-bottom:4px}
.bbody{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:34px}
.hint{font-size:14px;color:var(--mut);margin:4px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
svg.plot{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px}
svg .ax{stroke:var(--mut);stroke-width:2;fill:none}
svg .dot{fill:var(--dot);fill-opacity:.85}svg .ghost{fill:none;stroke:var(--ghost);stroke-width:2}
svg .foc{fill:var(--warm);stroke:var(--card);stroke-width:2}
svg text{fill:var(--fg);font-family:inherit}svg .lab{font-size:22px;fill:var(--mut)}svg .note{font-size:22px;font-weight:700}
.read{display:flex;gap:18px;flex-wrap:wrap;font-weight:700;margin-top:8px}.read span b{color:var(--warm)}
.eq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.eq span{border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:700;font-size:15px}
.eq.hi span{border-color:var(--warm);background:var(--warmbg)}
.eq i{font-style:normal;color:var(--mut);font-weight:700}
textarea{width:100%;min-height:120px;font:inherit;background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
textarea:focus{outline:none;border-color:var(--acc)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tab{background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:600}
.tab.on{background:var(--acc);color:var(--card);border-color:var(--acc)}
nav.foot{position:sticky;bottom:0;display:flex;gap:10px;justify-content:space-between;align-items:center;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;justify-content:center;align-items:flex-start;padding:16px;overflow:auto;z-index:20}
#menu .card{max-width:520px;width:100%}
#menu ol{margin:6px 0;padding-left:20px}#menu li{margin:2px 0}
#menu a{color:var(--acc);cursor:pointer;text-decoration:underline}
ul.tight{margin:6px 0;padding-left:22px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mini{font-size:15px;color:var(--mut)}
.fig{margin:8px 0 0}.fig .wrap{overflow-x:auto}.fig .in{position:relative}.fig img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}.fig .hl{position:absolute;border:3px solid #E2571B;border-radius:4px;pointer-events:none;box-shadow:0 0 0 2px rgba(255,255,255,.7)}.fig figcaption{font-size:14px;color:var(--mut);margin-top:4px}
details.paper summary{cursor:pointer;font-weight:700;color:var(--acc)}
.grp{display:flex;gap:10px;margin:8px 0}.grp button{flex:1;font-size:24px;font-weight:700;padding:14px 0;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg)}.grp button.on{background:var(--acc);color:var(--card);border-color:var(--acc)}
input.nm{width:100%;font:inherit;font-size:18px;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);margin:6px 0}
.bars{display:flex;flex-direction:column;gap:10px;margin:8px 0}.bars .b{display:flex;flex-direction:column;gap:3px}.bars .b i{display:block;height:26px;border-radius:6px;background:var(--acc);min-width:6px}.bars .b.s i{background:var(--warm)}
@media (max-width:480px){body{font-size:16px}h1{font-size:24px}}
</style>
<div id="app">
<header>
 <div class="top"><span id="part"></span><button class="btn sec sm" id="menubtn">Jump to…</button></div>
 <div class="bar"><i id="prog"></i></div>
 <h1 id="ttl"></h1>
</header>
<main id="main" style="display:flex;flex-direction:column;gap:14px"></main>
<nav class="foot"><button class="btn sec" id="back">Back</button><span><button class="btn sec sm" id="skip" hidden>Skip for now</button> <button class="btn" id="next">Next</button></span></nav>
</div>
<div id="menu" hidden><div class="card"><h3>Jump to a screen</h3><div id="menulist"></div><div class="row"><button class="btn" id="menuclose">Close</button></div></div></div>

 show('same');box.append(h('div',{class:'try',html:'Try it'}),h('p',{html:'Press the buttons. Grey dashed line = the truth. Orange line = our estimate.'}),tabs,ch.svg,fb);ctx.box.append(box);
 sort({id:'ou',q:'Is each estimate an UNDERestimate or an OVERestimate?',seed:4,buckets:[{id:'u',label:'UNDERestimate',sub:'weaker than the truth'},{id:'o',label:'OVERestimate',sub:'stronger than the truth'}],
  items:[{t:'Truth: +4. Our estimate: +2',b:'u',hint:'+2 is a weaker effect than +4.',why:''},{t:'Truth: +4. Our estimate: +6',b:'o',hint:'+6 is a stronger effect.',why:''},{t:'Truth: −3. Our estimate: −1.5',b:'u',hint:'−1.5 is closer to zero, so weaker.',why:''},{t:'Truth: −3. Our estimate: −4.5',b:'o',hint:'−4.5 is further from zero, so stronger.',why:''},{t:'Line is flatter than the truth',b:'u',hint:'Flatter = weaker.',why:''},{t:'Line is steeper than the truth',b:'o',hint:'Steeper = stronger.',why:''}],why:0})});

scr(PD,'Negative effects',()=>{
 card('<p>The trap: when the truth is <b>negative</b>, “weaker” and “down” point in different directions for the numbers.</p><p>Example: more hours of practice → <b>fewer</b> mistakes. The truth is a slope of <b>−3</b>. Suppose our estimate is <b>−1.5</b>. Look at the picture.</p>','key');
 const ch=Chart({xd:[0,10],yd:[0,50],xl:'Hours of practice (X)',yl:'Mistakes (Y)',aria:'Two downward lines'});
 ch.draw({lines:[{a:40,b:-3,col:'var(--truth)',d:1,w:3},{a:32.5,b:-1.5,col:'var(--warm)',w:5}],extra:(X,Y)=>'<text x="'+X(6.3)+'" y="'+Y(40-3*6.3-3)+'" class="lab">truth: −3</text><text x="'+X(6.3)+'" y="'+Y(32.5-1.5*6.3+7)+'" class="note" style="fill:var(--warm)">estimate: −1.5</text>'});
 ctx.box.append(h('div',{class:'card'},ch.svg,h('div',{html:'<p>The orange line is <b>flatter</b>, so the effect looks <b>weaker</b>: an <b>UNDERestimate</b>. But the number went from −3 to −1.5, which is <b>up</b> on the number line.</p><p>So: <b>weaker / UNDER</b> = closer to zero. <b>Stronger / OVER</b> = further from zero. Use “up/down” only if you say which number you mean.</p>'})));
 mcq({id:'neg',tag:'Check',q:'Truth: −3. Our estimate: −4.5. Which is correct?',opts:['An OVERestimate: the effect looks stronger (the number went down to −4.5)','An UNDERestimate: −4.5 is smaller than −3','No bias: both are negative','An UNDERestimate: the line is flatter'],ans:0,why:'−4.5 is further from zero than −3, so the effect looks stronger: an overestimate. The number went down, but the strength went up.',hints:['','Careful: “smaller number” is not “weaker effect”. Ask how far from zero.','Both negative does not mean they match. −4.5 is stronger than −3.','−4.5 is a steeper downward line, not flatter.']});
 mcq({id:'neg2',tag:'Check',q:'Truth: −3. Our estimate: −1.5. Which words go together?',opts:['Flatter, weaker, UNDERestimate','Steeper, stronger, OVERestimate','Flatter, stronger, OVERestimate','Steeper, weaker, UNDERestimate'],ans:0,why:'Closer to zero = flatter = weaker = underestimate.',hints:['','No. −1.5 is not steeper than −3.','Flatter means weaker, not stronger.','−1.5 is flatter, not steeper.']})});

scr(PE,'Random error in X',()=>{
 card('<p><b>Random error</b> means mistakes with no pattern. Some too high, some too low, by luck.</p><p><b>Error in X</b> here means error in the <b>talent rating</b>. A musician answers on a bad day, reads a question loosely, or just ticks a number that is a bit off. Their rating is the true talent plus some noise.</p><p>On the graph, noise in X slides each dot <b>sideways</b>.</p>','key');
 mcq({id:'ex1',tag:'Predict first',q:'If the talent ratings (X) get noisy at random, what will happen to the line?',opts:['It gets flatter','It gets steeper','It stays the same'],ans:0,why:'Press Play below to see it. Noise in X spreads the dots sideways, so X seems to matter less.',hints:['','Think: if X is mostly noise, does it predict Y more or less?','Not quite. Press Play below to find out.']});
 errLab('x');
 card('<p>Hollow dots are the true X values. Filled dots are what we observe, with noise. The line gets <b>flatter</b>: this is <b>attenuation</b> (the effect looks weaker, so it is <b>underestimated</b>, pushed <b>down</b> towards zero).</p><p>In the paper: if the 3-item talent score is noisy, its coefficient will look smaller than the true effect. The paper finds a tiny talent effect (B = .02). Noise in X is one possible reason.</p>','warm');
 mcq({id:'ex2',tag:'Check',q:'Random error in X (the talent rating) leads to which?',opts:['Flatter line, weaker effect, UNDERestimate','Steeper line, stronger effect, OVERestimate','No change at all','A line that is the same but more scattered'],ans:0,why:'Random error in X flattens the line (attenuation).',hints:['','No. That is the opposite.','No. We just watched the line change.','That is what happens with error in Y, not X.']})});

scr(PE,'Random error in Y',()=>{
 card('<p><b>Error in Y</b> means error in the <b>success</b> measure. A musician misremembers CD sales, rounds up their gigs, or reports airplay roughly. Mistakes with no pattern.</p><p>On the graph, noise in Y moves each dot <b>up or down</b>.</p>','key');
 mcq({id:'ey1',tag:'Predict first',q:'If success (Y) is reported with random mistakes, what happens to the line?',opts:['It stays about the same, but the dots spread out','It gets flatter','It gets steeper'],ans:0,why:'Press Play to see. Up-and-down noise averages out. The line stays; it just becomes less precise.',hints:['','Not for error in Y. Try Play and watch the line.','No. Watch the line when you press Play.']});
 errLab('y');
 card('<p>Random error in Y makes estimates <b>less precise</b> (bigger standard errors, harder to find an effect), but in this simple case it does <b>not</b> push the slope up or down.</p>','warm');
 sort({id:'xy',q:'Which random mistake is in X (the talent rating) and which is in Y (success)?',seed:6,buckets:[{id:'x',label:'Error in X',sub:'talent rating'},{id:'y',label:'Error in Y',sub:'success'}],
  items:[{t:'A musician ticks their talent rating while tired and rushing',b:'x',hint:'The talent rating is X.',why:''},{t:'A musician guesses how many CDs they sold',b:'y',hint:'CD sales is part of Y.',why:''},{t:'The word “talented” means different things to different people',b:'x',hint:'That affects the talent rating (X).',why:''},{t:'A musician misremembers how many gigs they played',b:'y',hint:'Gigs are part of Y.',why:''}],why:0});
 mcq({id:'xy2',tag:'Check',q:'Which random error flattens the line?',opts:['Error in X (talent rating)','Error in Y (success)','Both do exactly the same','Neither'],ans:0,why:'Random error in X flattens (attenuates). Random error in Y adds scatter.',hints:['','Not this one. Y noise just spreads the dots up and down.','They behave differently.','One of them does.']})});

scr(PF,'Systematic error',()=>{
 card('<p><b>Systematic error</b> has a <b>pattern</b>. It is not luck. Some kinds of people are wrong in the same direction. So the direction of the bias depends on the story, and you must <b>reason it out</b>.</p><p>Random error: mistakes cancel on average. Systematic error: they do not.</p>','key');
 card('<h3>In the paper</h3><p>Both talent (X) and success (Y) are <b>self-reported</b>. Confident or self-promoting musicians may rate their talent high <i>and</i> claim lots of success. Careful or modest musicians may do the opposite.</p>');
 mcq({id:'sy1',tag:'Think it through',q:'Confident musicians inflate BOTH their talent rating and their reported success. What does this do to the talent–success link?',opts:['It makes it look stronger than it really is (OVERestimate)','It makes it look weaker (UNDERestimate)','It has no effect','It makes it negative'],ans:0,why:'Confidence pushes X and Y up together, adding a link that is not real talent. The estimate is too strong.',hints:['','The extra shared movement adds to the link; it does not cancel it.','Both measures move together because of confidence, so it matters.','Both go up together, so the link is positive, not negative.']});
 mcq({id:'sy2',tag:'Think it through',q:'Now struggling musicians inflate their SUCCESS claims, but their talent ratings stay honest. The less talented they are, the more they exaggerate success. What happens?',opts:['A weaker, or even negative, link (UNDERestimate)','A stronger link (OVERestimate)','No change','The line becomes steeper'],ans:0,why:'Low-talent people report extra success, which breaks the link between talent and success. The effect looks weaker.',hints:['','Think about who exaggerates: low-talent people. That pulls the line the other way.','It changes who reports high success, so it matters.','Steeper would be a stronger effect, which is the opposite.']});
 mcq({id:'sy3',tag:'Another example',q:'In a survey on reading habits, poor readers under-report how many books are at home. What happens to the link between books at home and reading skill?',opts:['It is OVERestimated: low readers look like low-book homes, exaggerating the gap','It is UNDERestimated','No bias, because it is only one group','Cannot say'],ans:0,why:'The error is linked to the outcome (reading skill). Low scorers shift down on X, which strengthens the apparent link.',hints:['','The error pushes low readers down on X, which stretches the pattern.','One group making errors in a pattern is exactly what causes bias.','We can reason it out: the error is linked to the outcome.']})});

scr(PF,'Controlling for other variables',()=>{
 card('<p>In a regression, <b>controlling for</b> other variables means comparing musicians who are the <b>same</b> on those other things. The coefficient for X is then the link that is <b>left over</b>.</p><p>Look at perceived talent in the paper. On its own it goes with success. But it overlaps with other self-ratings, especially <b>professionalism</b>.</p>','key');
 card('<h3>Talent’s link with success keeps shrinking</h3><p class="mini">Standardised size of the talent–success link, from the paper’s tables.</p><div class="bars"><div class="b"><span>Talent on its own (Table 1): <b>.17</b>, significant</span><i style="width:100%"></i></div><div class="b s"><span>Controlling for background and personality (Table 2, step 2): <b>.05</b>, not significant</span><i style="width:29%"></i></div><div class="b s"><span>Also controlling for professional context (step 3): <b>.04</b>, not significant</span><i style="width:24%"></i></div></div>');
 paper('Find it in the paper: Table 1 (p. 258) and Table 2 (p. 259)',[clip('table1','Table 1: look along the “Self-perc. talent” row. It is .17** with success (first column) and .53** with Professionalism (column 17).',{min:900,hl:[[85.5,0,100,6.5]]}),clip('table2','Table 2: the talent row (orange box) is small and not starred. The professionalism row is above it.',{hl:[[81,0,100,3.9],[72.2,0,100,3.9]]})],true);
 mcq({id:'ctl0',tag:'Check',q:'Talent is correlated with success (r = .17**) but not significant in the regression. What is the best explanation?',opts:['Talent overlaps with other predictors, especially professionalism (r = .53). Once they are held constant, talent adds little extra','Talent has no effect on success at all','Regression always gives smaller effects than correlations','The correlation must be a mistake'],ans:0,why:'Controlling compares musicians who are alike on the other variables. Much of what talent “explains” is shared with professionalism and the others. The paper says the same: those other variables “proved to be stronger predictors”.',hints:['','Not significant does not mean “no effect”. It means we cannot tell it apart from zero here.','Not always. It depends on how much the predictors overlap.','Both numbers are in the paper and both can be right.']});
 mcq({id:'ctl1b',tag:'Check',q:'In Table 2 the talent coefficient is B = .02 (SE = .03). What does it mean?',opts:['Comparing musicians who are the same on all the other variables, one more point of talent goes with about .02 more on the success score. That is tiny, and we cannot tell it from zero','Talent explains 2% of success','Talent causes a 2-point rise in success','Talent is not measured properly'],ans:0,why:'A coefficient is a slope with the other variables held constant. With SE = .03, .02 is well within noise.',hints:['','R-squared is the share explained. A coefficient is a slope.','A slope here is an association, not proof of cause.','That may be true, but it is not what B = .02 says.']});
 card('<h3>Not significant does not mean “no effect”</h3><p>Three reasons talent could look weak here:</p><ul class="tight"><li><b>Overlap:</b> professionalism takes the shared part. Both are self-ratings (the paper calls them attitudinal, self-evaluation measures), so they may share confidence.</li><li><b>Measurement error in X:</b> a noisy 3-item self-rating gives a flatter line.</li><li><b>It may be small.</b></li></ul>','warm')});

scr(PF,'Error in control variables',()=>{
 card('<p>Controls are also measured, and measured badly. This causes <b>residual confounding</b>: part of what we meant to hold constant is still leaking through.</p><p>Example from the paper: music lessons, conservatory training and professionalism are controls. A control should strip out the real, background part of talent. If the control is a noisy measure, it only strips out <i>some</i> of it. What is left in the talent rating can be over- or under-confidence.</p>','key');
 mcq({id:'ctl1',tag:'Check',q:'What does “residual confounding” mean?',opts:['A control is measured with error, so some of the confounding is not removed','The residuals are zero','We forgot to include X','The sample is too small'],ans:0,why:'If the control is noisy, adjusting for it only partly removes the confounder.',hints:['','No. That is not what the term refers to.','No, that is a different problem.','No, sample size is a precision issue.']});
 mcq({id:'ctl2',tag:'Check',q:'Why does a badly measured control matter for the talent coefficient?',opts:['It does not fully remove the effect of the thing it stands for, so talent’s coefficient can still be biased','It only changes how the graph looks','It always makes talent’s effect zero','It does not matter if X is measured well'],ans:0,why:'Bad controls leave some of the confounder in the model. The talent coefficient can still be pushed in some direction.',hints:['','It changes the numbers, not just the look.','It does not always do that. The direction depends on the story.','Even if X is perfect, controls matter.']})});

scr(PG,'Cause and effect',()=>{
 card('<p>A pattern in the data does not tell you which way the arrow points. When X and Y go together, there are three stories:</p><ul class="tight"><li><b>X causes Y</b></li><li><b>Y causes X</b> (reverse causality)</li><li><b>Something else causes both</b> (confounding)</li></ul><p>The paper’s data are <b>cross-sectional</b>: everyone is measured once. So the authors are careful about cause. They ask: does a manager make a musician successful, or do managers sign musicians who are already successful?</p>','key');
 paper('Find it in the paper: the authors on cause (p. 261)',[clip('causal','Zwaan et al. (2009), p. 261')],true);
 sort({id:'cause',q:'Which story fits each statement?',seed:11,buckets:[{id:'x',label:'X causes Y',sub:'e.g. manager → success'},{id:'y',label:'Y causes X',sub:'reverse causality'},{id:'z',label:'Something else causes both',sub:'confounding'}],
  items:[{t:'A manager gets a band onto the radio, so the band becomes successful',b:'x',hint:'The manager’s work leads to success.',why:''},{t:'Managers only sign musicians who are already selling well',b:'y',hint:'Success comes first and attracts the manager.',why:''},{t:'Confident musicians rate their talent highly and also claim lots of success',b:'z',hint:'Confidence drives both ratings.',why:''},{t:'Successful musicians can afford a professional website',b:'y',hint:'Success pays for the website.',why:''}],why:0});
 mcq({id:'cause2',tag:'Check',q:'Why can the paper not say that having a professional network causes success?',opts:['The data are from one point in time, and managers may choose musicians who are already successful','Because the sample is too big','Because networks are not measured','Because success is a number'],ans:0,why:'Cross-sectional data cannot show which came first. The authors say both directions probably hold some truth.',hints:['','A big sample does not fix the direction problem.','Network is measured (4 yes/no items).','That is not the problem.']});
 mcq({id:'cause3',tag:'Check',q:'What kind of data would help show which comes first?',opts:['Following the same musicians over several years','A bigger one-off survey','Asking the same people the same questions again at the same moment','Dropping the controls'],ans:0,why:'Longitudinal data show who had a manager before success. The authors call for exactly this.',hints:['','More of the same one-off data still cannot show order.','Same moment, same problem.','Dropping controls usually makes confounding worse.']})});

scr(PG,'Who is in the data?',()=>{
 card('<p>Every study has people who <b>could</b> have been studied and a subset who actually <b>are</b>. If the way people get into the data is related to the things we study, results can be biased. This is <b>selection</b>.</p><p>In the paper, musicians were reached through a musicians’ union, a national talent competition and a magazine’s demo reviews. They are not all Dutch pop musicians.</p>','key');
 mcq({id:'sel1',tag:'Think',q:'Who is probably MISSING from a sample taken from a talent competition and a union?',opts:['Musicians who never entered a competition or joined a union, and those who quit music','Only the most successful musicians','Only musicians over 50','Nobody; it is a full list of Dutch pop musicians'],ans:0,why:'Quitters and unorganised musicians are likely missing. Many of those would have low success: selection on Y.',hints:['','No: if anything, successful musicians are more likely to be in the data.','Nothing suggests this.','No. This is a sample, not a full census.']})});

scr(PG,'Selection on Y, X, or both',()=>{
 card('<p>The type of selection decides what happens:</p><ul class="tight"><li><b>Selection on Y</b> (the outcome): the line tends to get <b>flatter</b>.</li><li><b>Selection on X</b> (the cause): the slope is about right, but the range is narrower and results may not travel to other groups.</li><li><b>Selection on both</b>: can bend the line either way, or create a false link.</li></ul>','key');
 mcq({id:'sel2',tag:'Predict first',q:'We only keep musicians who are already successful (high Y). What do you expect for the line?',opts:['Flatter','Steeper','The same'],ans:0,why:'Try the buttons below. Cutting off low-success musicians removes the part of the pattern where the line was steepest.',hints:['','Think about what is missing: low-success musicians, who made the line rise.','Try the buttons below and watch the orange line.']});
 selLab()});

scr(PG,'Spot the selection',()=>{
 sort({id:'selsort',q:'What kind of selection is each of these?',seed:9,buckets:[{id:'y',label:'Selection on Y',sub:'the outcome decides who is in'},{id:'x',label:'Selection on X',sub:'the cause decides who is in'},{id:'b',label:'Selection on both',sub:'or on a shared result'}],
 items:[{t:'Only musicians who are still working are surveyed (successful ones stay)',b:'y',hint:'Staying in music depends on how well the career went.',why:'Survivors of a career: outcome decides who is seen.'},
 {t:'Only musicians with high talent ratings take part',b:'x',hint:'Talent is X, the cause.',why:'The cause decides who is in.'},
 {t:'Healthy immigrant effect: people who migrate are healthier than those who stay',b:'b',hint:'Moving depends on health and on other advantages.',why:'Both migration and health shape who appears.'},
 {t:'Salmon bias: ill migrants return home, so they vanish from host-country data',b:'y',hint:'Ill health (Y) causes them to leave the data.',why:'The outcome (health) decides who stays in the data.'},
 {t:'Gender pay gap measured only among people who have a job',b:'b',hint:'Having a job depends on both gender and wage prospects.',why:'Employment depends on both X (gender) and Y (wages).'}],why:1})});

scr(PG,'External validity',()=>{
 card('<p><b>Selection bias</b> is about whether the estimate is right for the group we meant to study. <b>External validity</b> is about whether results from <i>this</i> sample would also hold for <b>other</b> people, places or times.</p><p>In the paper: N = 340 Dutch pop musicians, reached through a union, a national talent competition and a magazine’s demo reviews. 73.5% were men, and the average age was 25. Success and talent were self-reported.</p>','key');
 sort({id:'ext',q:'Would the results probably apply to these groups?',seed:13,buckets:[{id:'y',label:'Probably yes',sub:'similar to the sample'},{id:'n',label:'Unsure',sub:'different from the sample'}],
  items:[{t:'Other young Dutch pop musicians who enter competitions or join the union',b:'y',hint:'They are like the people in the sample.',why:''},{t:'Pop musicians who never enter competitions or join a union',b:'n',hint:'They are the people the sampling route missed.',why:''},{t:'Classical musicians',b:'n',hint:'A different career and different success measures.',why:''},{t:'Pop musicians in another country or another decade',b:'n',hint:'Different industry and different times.',why:''},{t:'Musicians whose careers ended early',b:'n',hint:'Quitters are unlikely to be in the data.',why:''}],why:0});
 mcq({id:'ext2',tag:'Check',q:'The estimate is right for this sample, but might not hold for other musicians. This is a problem of…',opts:['External validity','Random error in X','Reverse causality','Reliability'],ans:0,why:'Right for this group, uncertain for others: external validity. Selection bias is when the estimate is wrong even for the group we wanted.',hints:['','Random error is about noisy measures, not who is in the sample.','Reverse causality is about the direction of the arrow.','Reliability is about consistency of a measure.']})});

scr(PH,'What is a collider?',()=>{
 card('<p>A <b>collider</b> is a variable that two things both <b>cause</b>:</p><p style="text-align:center;font-weight:700;font-size:19px">Height → <span style="border:2px solid var(--warm);border-radius:8px;padding:2px 10px">Picked by the club</span> ← Scoring skill</p><p>A football club picks players who are tall <b>or</b> good scorers. Being picked is the collider.</p><p>The trap: if you look <b>only at picked players</b> (select on the collider) or <b>control for it</b>, two things that were unrelated start to look linked.</p>','key');
 colLab();
 mcq({id:'col1',tag:'Check',q:'Why do taller picked players look worse at scoring?',opts:['The club picks either tall or good scorers, so a short picked player must be a good scorer','Tall players really are worse scorers','The graph is wrong','Short players train harder'],ans:0,why:'Among picked players, someone who is not tall must be good to be picked. This creates a false negative link, only because of who is in the data.',hints:['','In the full group the line was flat, so this is not real.','The graph is right. Look at who is included.','Nothing says this.']})});

scr(PH,'A collider in the paper?',()=>{
 card('<p class="mini">Important: this is <b>our own reasoning</b>, not something the paper claims. Use it to practise, and challenge it.</p><p>The paper controls for <b>professional network</b>: having a manager, booking agency, record company or publisher. Plausibly:</p><ul class="tight"><li>more <b>talented</b> musicians attract a network, and</li><li>more <b>successful</b> musicians attract a network (the paper itself raises that managers may sign musicians who are already successful).</li></ul><p>If a network is caused by both, it is a collider, and controlling for it can create a false link between talent and success.</p>','warm');
 sort({id:'colp',q:'Fill in the diagram: which card belongs in which box?',seed:7,buckets:[{id:'c',label:'Causes (arrows start here)',sub:'two cards'},{id:'k',label:'Collider (arrows meet here)',sub:'one card'},{id:'n',label:'Not part of the collider',sub:'one card'}],
  items:[{t:'Perceived talent',b:'c',hint:'Talent helps musicians get a network.',why:'Talent → network'},{t:'Career success',b:'c',hint:'Success also attracts managers and labels.',why:'Success → network (reverse causality)'},{t:'Professional network (manager, agency, label, publisher)',b:'k',hint:'Both talent and success lead to it.',why:'Network ← talent and ← success'},{t:'Music lessons as a child',b:'n',hint:'Lessons came before, and success does not cause them.',why:'Not caused by success, so not a collider.'}],why:1});
 mcq({id:'col2',tag:'Think',q:'If professional network IS a collider, what could controlling for it do to the talent–success link?',opts:['Create a false link between talent and success (probably pushing the estimate down)','Remove all bias','Nothing at all','Make talent the cause of success'],ans:0,why:'Among musicians with the same network, a less talented one needs more success to get that network. That creates a false negative link and could make talent look weaker.',hints:['','Controlling for a collider adds bias; it does not remove it.','It changes the comparison, so it matters.','It does not decide causation.']});
 card('<p><b>A second possible collider-style problem:</b> getting into the sample at all. Musicians who enter a talent competition or join a union may need talent <i>or</i> success. That is selection on a shared result, which works the same way.</p>')});

const QS=[
 {n:1,q:'How does the study measure perceived talent (X) and success (Y)?',hint:'Think: what questions were asked? Self-report or from records? Which items?',model:'<p><b>X:</b> a 3-item self-rating of talent (a Watt 2004 scale; alpha .73). Musicians compare themselves with other musicians.</p><p><b>Y:</b> “objective” career success, but still self-reported: four items on national radio airplay, national TV airplay, CD sales and performance frequency over the past 12 months, averaged into one score (alpha .73) and log-transformed.</p>'},
 {n:2,q:'Do you see any sources of measurement error in each?',hint:'Think about random error and systematic error, in both X and Y.',model:'<p><b>In X:</b> random noise in 3 short items; “compared with other musicians” is vague. Systematic: confident musicians rate themselves high, modest ones low. That is confidence rather than talent.</p><p><b>In Y:</b> self-reported numbers can be misremembered or rounded. Systematic: musicians may exaggerate, and the same confident people may inflate both X and Y, which can overestimate the link.</p>'},
 {n:3,q:'How does the study discuss reliability and validity for these measures?',hint:'What numbers does the paper report? Does it show the items? What does alpha tell you?',model:'<p><b>Reliability:</b> Cronbach’s alpha .73 for the talent items (items agree), and .73 for the success score. Professional network is lower (KR-20 .57).</p><p><b>Validity:</b> little direct evidence that a self-rating captures real talent. The items are not listed. Alpha is about consistency, not validity.</p>'},
 {n:4,q:'What sources of selection are there and how might they bias the association?',hint:'Who is in the sample? Who is missing, and why? Is it selection on X, Y, or both?',model:'<p>Musicians were reached through organisations: union members, entrants to the national talent competition and musicians who sent demos to a magazine (N = 340; 73.5% male). Missing: musicians in neither group, and musicians who gave up.</p><p>If the missing people are mostly low-success (selection on Y), the line looks <b>flatter</b>: the effect is underestimated. Entry might depend on talent <i>or</i> success (selection on both), which could create a false link. Controlling for professional network might do something similar.</p>'},
 {n:5,q:'How do you think results might have differed with a broader sample or better measures?',hint:'Link back to attenuation (flatter line) and to a wider range of X and Y.',model:'<p><b>Broader sample:</b> including quitters, amateurs and non-members would widen the range of talent and success, so the true link would probably show up more clearly.</p><p><b>Better measures:</b> independent ratings of talent (not self-ratings) and records of sales and airplay would reduce random error in X and Y. Less error in X means less flattening, so the talent effect (here B = .02) might be larger. Better measures would also reduce confidence-based systematic error.</p>'}];

const AFTER={1:'From idea to measure',3:'Valid and reliable',2:'Error in control variables',4:'External validity',5:'A collider in the paper?'};
QS.forEach(q=>{const at=S.findIndex(x=>x.title===AFTER[q.n]);const prev=S[at];
 S.splice(at+1,0,{part:prev.part,title:'Your answer: seminar question '+q.n,fn:()=>{
 card('<p>Time to answer one of the five seminar questions, using what you have just practised and the paper. Write your own answer first, then compare it with the model answer.</p>','key');
 write({id:'q'+q.n,n:q.n,q:q.q,hint:q.hint,model:q.model});if(q.n===5)paper('Find it in the paper: what the authors say about better measures (p. 262)',[clip('limit','Zwaan et al. (2009), p. 262')])}})});

scr(PI,'All done',()=>{
 const ids=Object.keys(ST.done),total=ids.length,first=ids.filter(i=>ST.first[i]).length,again=ids.filter(i=>!ST.first[i]).map(i=>ST.scr[i]);
 card('<h3>You made it.</h3><p>You completed <b>'+total+'</b> checks and got <b>'+first+'</b> right the first time.</p>'+(again.length?'<p>Worth another look: <b>'+[...new Set(again)].join(', ')+'</b>. Use “Jump to…” at the top.</p>':'<p>Nothing to revisit. Well done.</p>')+eq(['Flatter','Weaker','UNDER','Pushed DOWN'])+eq(['Steeper','Stronger','OVER','Pushed UP']),'key');
 const out=h('textarea',{readonly:'',style:'min-height:160px',hidden:''});
 const b=h('button',{class:'btn',html:'Copy my seminar answers',onclick:()=>{const t=QS.map(q=>'Q'+q.n+'. '+q.q+'\n'+(ST.ans['q'+q.n]||'(no answer)')).join('\n\n');out.value=t;out.hidden=false;out.select();(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent='Copied'}).catch(()=>{b.textContent='Select and copy the text below'})}});
 ctx.box.append(h('div',{class:'card'},h('p',{html:'Take your answers into the seminar.'}),h('div',{class:'row'},b),out))});

/* ---------- engine ---------- */
function render(){
 const s=S[ST.at];const box=$('#main');box.innerHTML='';
 ctx={box,regs:[],skip:false,reg(id){this.regs.push(id);ST.scr[id]=s.title},mark(id,first,tries){const was=ST.done[id];if(!(id in ST.first))ST.first[id]=first?1:0;ST.done[id]=1;save();gate();if(!was&&id.charAt(0)!=='q')log({id,screen:ST.scr[id],first:ST.first[id],tries:tries||1})}};
 $('#part').textContent=s.part+'  ·  screen '+(ST.at+1)+' of '+S.length+(ST.who?'  ·  Group '+ST.who.g:'');$('#ttl').textContent=s.title;
 s.fn();gate();$('#back').disabled=ST.at===0;$('#next').hidden=ST.at===S.length-1;
 $('#prog').style.width=((ST.at+1)/S.length*100)+'%';save();window.scrollTo(0,0)}
function gate(){const ok=ctx.regs.every(id=>ST.done[id])||ctx.skip;$('#next').disabled=!ok;$('#skip').hidden=ctx.regs.every(id=>ST.done[id])||ctx.skip||ST.at===S.length-1}
$('#next').onclick=()=>{if(ST.at<S.length-1){ST.at++;render()}};
$('#back').onclick=()=>{if(ST.at>0){ST.at--;render()}};
$('#skip').onclick=()=>{ctx.skip=true;gate()};
function menu(){const l=$('#menulist');l.innerHTML='';let part='',ol=null;S.forEach((s,i)=>{if(s.part!==part){part=s.part;l.append(h('b',{html:part}));ol=h('ol',{start:i+1});l.append(ol)}ol.append(h('li',{},h('a',{html:s.title,onclick:()=>{ST.at=i;$('#menu').hidden=true;render()}})))})}
$('#menubtn').onclick=()=>{menu();$('#menu').hidden=false};$('#menuclose').onclick=()=>{$('#menu').hidden=true};
if(ST.at>=S.length)ST.at=0;
render();
</script>
